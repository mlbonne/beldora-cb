<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Fragment</title>
	<link rel="stylesheet" href="css/main.css">
	<link rel="stylesheet" href="__tb/css/fonts.css">
	<link rel="stylesheet" href="__tb/css/content.css">
	<style>
		body.tb-print { background: var(--tb-paper) !important; padding: 18px 26px 40px !important; font-size: 11.5pt !important; max-width: 760px; margin: 0 auto; }
		.tb-empty { color: #9a8b78; font-style: italic; text-align: center; margin-top: 40px; font-family: var(--tb-ui-font); }
	</style>
</head>
<body class="tb-print tb-theme-parchment">
	<div id="c"><div class="tb-empty">Select something to preview it here.</div></div>
	<script>
		window.setContent = (html) => {
			const c = document.getElementById("c");
			c.innerHTML = html || "<div class=\"tb-empty\">Nothing to show.</div>";
			// Missing site artwork is hidden instead of showing broken images
			c.querySelectorAll("img").forEach(img => img.addEventListener("error", () => (img.closest(".ve-rd__wrp-image") || img).remove()));
			c.querySelectorAll("a").forEach(a => a.addEventListener("click", e => e.preventDefault()));
			window.scrollTo(0, 0);
		};
	</script>
</body>
</html>
